# Blueprint do Render: Web Service (Docker) + PostgreSQL gerenciado.
# Render > New > Blueprint > selecionar este repositório.
services:
  - type: web
    name: cupcakes-gourmet
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: cupcakes-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: cupcakes-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: cupcakes-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: cupcakes-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: cupcakes-db
          property: password
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"

databases:
  - name: cupcakes-db
    databaseName: cupcakes
    user: cupcakes
    plan: free
